<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIFECRAFT AI — 60s Promo</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#052F2A}
  [data-composition-id="lifecraft-promo"]{position:relative;width:100%;height:100%;overflow:hidden;background:#052F2A;font-family:"Noto Sans Thai","Noto Sans",sans-serif}
  .scene{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;will-change:transform,opacity}
  .scene img{width:100%;height:100%;object-fit:cover;display:block;will-change:transform}
</style>
</head>
<body>
<div data-composition-id="lifecraft-promo" data-start="0" data-duration="60" data-width="1920" data-height="1080">
  <div id="scene-1" class="scene" data-start="0" data-duration="7.3" data-track-index="1"><img src="assets/scenes/scene1.png" alt=""></div>
  <div id="scene-2" class="scene" data-start="6.7" data-duration="8.6" data-track-index="2"><img src="assets/scenes/scene2.png" alt=""></div>
  <div id="scene-3" class="scene" data-start="14.7" data-duration="8.6" data-track-index="1"><img src="assets/scenes/scene3.png" alt=""></div>
  <div id="scene-4" class="scene" data-start="22.7" data-duration="9.6" data-track-index="2"><img src="assets/scenes/scene4.png" alt=""></div>
  <div id="scene-5" class="scene" data-start="31.7" data-duration="9.6" data-track-index="1"><img src="assets/scenes/scene5.png" alt=""></div>
  <div id="scene-6" class="scene" data-start="40.7" data-duration="8.6" data-track-index="2"><img src="assets/scenes/scene6.png" alt=""></div>
  <div id="scene-7" class="scene" data-start="48.7" data-duration="7.6" data-track-index="1"><img src="assets/scenes/scene7.png" alt=""></div>
  <div id="scene-8" class="scene" data-start="55.7" data-duration="4.3" data-track-index="2"><img src="assets/scenes/scene8.png" alt=""></div>
  <audio id="audio-main" data-start="0" data-duration="60" data-track-index="10" src="assets/audio/narration_music.wav" data-volume="1"></audio>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({paused:true});
// First scene entrance.
tl.from("#scene-1", {opacity:0, scale:0.985, duration:0.65, ease:"power3.out"}, 0);
tl.to("#scene-1 img", {scale:1.025, duration:7.3, ease:"none"}, 0);
// Incoming scenes cover the outgoing frame; no pre-transition exit animations.
tl.from("#scene-2", {xPercent:100, duration:0.6, ease:"power3.inOut"}, 6.7);
tl.to("#scene-2 img", {scale:1.025, duration:8.6, ease:"none"}, 6.7);
tl.from("#scene-3", {xPercent:-100, duration:0.6, ease:"power3.inOut"}, 14.7);
tl.to("#scene-3 img", {scale:1.025, duration:8.6, ease:"none"}, 14.7);
tl.from("#scene-4", {yPercent:100, duration:0.6, ease:"power3.inOut"}, 22.7);
tl.to("#scene-4 img", {scale:1.025, duration:9.6, ease:"none"}, 22.7);
tl.from("#scene-5", {xPercent:100, duration:0.6, ease:"power3.inOut"}, 31.7);
tl.to("#scene-5 img", {scale:1.025, duration:9.6, ease:"none"}, 31.7);
tl.from("#scene-6", {xPercent:-100, duration:0.6, ease:"power3.inOut"}, 40.7);
tl.to("#scene-6 img", {scale:1.025, duration:8.6, ease:"none"}, 40.7);
tl.from("#scene-7", {yPercent:-100, duration:0.6, ease:"power3.inOut"}, 48.7);
tl.to("#scene-7 img", {scale:1.025, duration:7.6, ease:"none"}, 48.7);
tl.from("#scene-8", {xPercent:100, duration:0.6, ease:"power3.inOut"}, 55.7);
tl.to("#scene-8 img", {scale:1.02, duration:4.3, ease:"none"}, 55.7);
// Final-scene fade only.
tl.to("#scene-8", {opacity:0, duration:0.4, ease:"power2.in"}, 59.6);
window.__timelines["lifecraft-promo"] = tl;
</script>
</body>
</html>
